<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>
Industrial Safety Monitor
</title>

<link rel="stylesheet"
href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<button onclick="logout()" class="logout-btn">
Logout
</button>
</head>

<body>

<div class="container">

<div class="header">

<h1>
🏭 Industrial Safety Monitor
</h1>

<span id="clock">
--:--
</span>

</div>

<div class="grid">

<div class="card">
<h3>🌡 Temperature</h3>
<p id="temperature">-- °C</p>
</div>

<div class="card">
<h3>📏 Distance</h3>
<p id="distance">-- cm</p>
</div>

<div class="card">
<h3>🚨 Intrusion</h3>
<p id="intrusion">SAFE</p>
</div>

<div class="card">
<h3>⚙ Status</h3>
<p id="status">NORMAL</p>
</div>

<div class="card graph-card">

<div class="graph-header">

<h3>
Temperature Trend
</h3>

<span>
Last 15 Readings
</span>

</div>

<div class="chart-wrapper">
<canvas id="tempChart"></canvas>
</div>

</div>

<div class="card alerts-card">

<h3>
Recent Alerts
</h3>

<ul id="alerts">

<li>
No alerts yet
</li>

</ul>

</div>

</div>

</div>

<script src="dashboard.js"></script>
<script>
if(localStorage.getItem("loggedIn") !== "true")
{
    window.location.href = "login.html";
}
<script>
function logout()
{
    localStorage.removeItem("loggedIn");
    window.location.href = "index.html";
}
</script>
</script>
</body>
</html>
